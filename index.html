
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10102a">
<title>FINOVA — Your Money. Made Clearer.</title>
<style>
:root{
  --bg:#f5f5fc;--surface:#fff;--surface2:#f0effa;--text:#17172e;
  --muted:#77788f;--line:#e8e7f2;--primary:#7160f5;--primary2:#9a8cff;
  --navy:#12122d;--green:#16a581;--red:#e35d83;--shadow:0 12px 38px #2720520c;
  --radius:22px;
}
[data-theme="dark"]{
  --bg:#0d0d20;--surface:#17172f;--surface2:#22223e;--text:#f2f1ff;
  --muted:#a3a2c0;--line:#30304b;--primary:#9a8bff;--primary2:#b7acff;
  --navy:#101027;--shadow:0 12px 38px #00000020;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9a8cff;outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
.hidden{display:none!important}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:258px;background:var(--surface);border-right:1px solid var(--line);padding:24px 17px;z-index:30;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;align-items:center;gap:12px;padding:3px 8px 27px}
.brand-logo{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#a59aff,#6250e8);color:white;font-weight:900;font-size:23px;box-shadow:0 8px 20px #7966ee35}
.brand-name{font-weight:850;font-size:21px;letter-spacing:1.7px}
.brand-tag{font-size:10px;color:var(--muted);margin-top:3px}
.nav-label{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--muted);padding:13px 12px 9px}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:13px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:650;transition:.2s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:linear-gradient(110deg,#7765f61d,#a398ff12);color:var(--primary);box-shadow:inset 3px 0 var(--primary)}
.nav-icon{width:20px;text-align:center;font-size:17px}
.side-bottom{margin-top:auto}
.sponsor-mini{border:1px solid var(--line);border-radius:17px;padding:14px;background:var(--surface2);font-size:12px;line-height:1.6}
.sponsor-mini a{color:var(--primary);font-weight:800;text-decoration:none}
.main{margin-left:258px;min-height:100vh}
.topbar{height:77px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:15px}
.top-left,.top-right{display:flex;align-items:center;gap:13px}
.page-kicker{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.page-heading{font-size:17px;font-weight:800;margin-top:3px}
.icon-btn{height:39px;width:39px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:17px}
.avatar{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#a69aff,#6552e8);color:white;display:grid;place-items:center;font-weight:800}
.content{padding:30px 34px 50px;max-width:1500px;margin:auto}
.welcome-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}
h1{font-size:clamp(24px,3vw,32px);letter-spacing:-1px;margin:0 0 8px}
h2{font-size:19px;margin:0 0 7px;letter-spacing:-.35px}
h3{font-size:14px;margin:0 0 9px}
p{line-height:1.65}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(120deg,#8170ff,#6653e8);color:white;box-shadow:0 7px 18px #7564ef25}
.btn-soft{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:#e35d8315;color:#dc527a;border:1px solid #e35d8330}
.btn-full{width:100%}
.grid{display:grid;gap:17px}
.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-width:0}
.stat-label{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.stat-value{font-size:clamp(20px,2.1vw,28px);font-weight:850;letter-spacing:-1px;margin:15px 0 7px;overflow-wrap:anywhere}
.stat-foot{font-size:11px;color:var(--muted)}
.stat-icon{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:17px}
.balance-card{color:#fff;background:linear-gradient(130deg,#ec82ae,#d8528e 55%,#b94283);border:0;position:relative;overflow:hidden}
.balance-card::before,.balance-card::after{content:"";position:absolute;border:1px solid #ffffff20;border-radius:50%;width:190px;height:190px;right:-70px;top:-95px}
.balance-card::after{width:130px;height:130px;right:-35px;top:-65px}
.balance-card .stat-label,.balance-card .stat-foot{color:#ffffffd1}
.balance-card .stat-icon{background:#ffffff20;color:white}
.balance-card .stat-value{font-size:clamp(22px,2vw,30px);position:relative;z-index:1}
.balance-card .balance-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.balance-card .plan-chip{display:inline-flex;align-items:center;gap:5px;background:#ffffff26;border:1px solid #ffffff42;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:800}
.balance-card.gold{background:linear-gradient(130deg,#e8c778,#c89a37 55%,#9e7222)}
.balance-card.platinum{background:linear-gradient(130deg,#cbd1e5,#8d98b6 55%,#596784)}
.balance-card.platinum,.balance-card.gold{color:#fff}
.balance-card .card-link{color:#fff;font-size:10px;font-weight:800;text-decoration:none;white-space:nowrap}
.split{grid-template-columns:minmax(0,1.45fr) minmax(270px,1fr);margin-bottom:19px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.section-head h2{margin:0}
.link-btn{border:0;background:none;color:var(--primary);font-size:11px;font-weight:800;padding:5px}
.chart{height:205px;width:100%;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:7px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.bar-track{height:8px;background:var(--surface2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#7b68f7,#b1a5ff);transition:width .5s}
.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin:15px 0 8px}
.tx-list{display:grid}
.tx-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:0}
.tx-icon{width:39px;height:39px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:var(--surface2)}
.tx-main{min-width:0;flex:1}
.tx-name{font-weight:750;font-size:12px;overflow-wrap:anywhere}
.tx-meta{font-size:10px;color:var(--muted);margin-top:4px}
.tx-amount{font-size:12px;font-weight:800;white-space:nowrap}
.positive{color:var(--green)}.negative{color:var(--red)}
.page{animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.premium-banner{background:linear-gradient(115deg,#181638,#36306e 65%,#6252a9);border-radius:23px;padding:25px;color:white;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px;overflow:hidden;position:relative}
.premium-banner::after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff18;border-radius:50%;right:15%;top:-130px}
.premium-banner h2{font-size:22px}
.premium-banner p{color:#dad7ff;font-size:12px;margin:7px 0}
.plan-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.plan-card{position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.plan-card:hover{transform:translateY(-4px)}
.plan-card.selected{border:2px solid var(--primary);padding:21px}
.plan-card.gold-plan{background:linear-gradient(150deg,var(--surface),color-mix(in srgb,#e3bd64 12%,var(--surface)))}
.plan-card.platinum-plan{background:linear-gradient(150deg,var(--surface),color-mix(in srgb,#aeb8d2 17%,var(--surface)))}
.plan-tag{display:inline-block;padding:6px 9px;border-radius:9px;background:var(--surface2);font-size:10px;font-weight:850;letter-spacing:.5px}
.plan-price{font-size:31px;letter-spacing:-1.3px;font-weight:900;margin:17px 0 5px}
.plan-price span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.plan-features{padding:0;list-style:none;margin:22px 0;display:grid;gap:12px;font-size:12px;color:var(--muted)}
.plan-features li::before{content:"✓";color:var(--green);font-weight:900;margin-right:9px}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 10px;background:var(--surface2);font-size:10px;font-weight:800}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:7px;min-width:0}
.field label{font-size:11px;font-weight:750;color:var(--muted)}
.field input,.field select,.field textarea,.search-input{width:100%;min-width:0;padding:12px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:12px}
.field textarea{resize:vertical;min-height:90px}
.field.full{grid-column:1/-1}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:800}
td,th{padding:14px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{padding-left:0}
tr:last-child td{border-bottom:0}
.row-actions{display:flex;gap:6px}
.mini-btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 8px;font-size:10px}
.account-card{position:relative;overflow:hidden}
.account-card::after{content:"";position:absolute;width:100px;height:100px;right:-30px;bottom:-35px;border-radius:50%;background:var(--primary);opacity:.07}
.account-icon{width:45px;height:45px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:21px;margin-bottom:22px}
.debit-card{min-height:205px;border-radius:21px;padding:22px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#25234d,#5c4cba 75%,#9a8cff);box-shadow:0 14px 32px #4638a32b}
.debit-card.gold-card{background:linear-gradient(135deg,#64502a,#b28a39 65%,#e0c77c)}
.debit-card::after{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-80px;border:1px solid #ffffff28;border-radius:50%;box-shadow:0 0 0 20px #ffffff06,0 0 0 40px #ffffff05}
.card-chip{width:31px;height:23px;border-radius:6px;background:linear-gradient(135deg,#e9e1b8,#8c8055);margin-top:18px}
.card-number{font-size:16px;letter-spacing:3px;margin:23px 0 17px}
.card-bottom{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px}
.assistant-box{background:var(--surface2);padding:18px;border-radius:17px;margin-bottom:13px}
.chat-messages{display:grid;gap:12px;margin-bottom:15px;max-height:400px;overflow:auto}
.chat-msg{padding:13px 15px;border-radius:15px;max-width:92%;font-size:12px;line-height:1.7;white-space:pre-wrap}
.chat-msg.bot{background:var(--surface2);justify-self:start}
.chat-msg.user{background:var(--primary);color:white;justify-self:end}
.health-score{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;margin:8px auto 18px;background:conic-gradient(var(--primary) var(--score,65%),var(--surface2) 0);position:relative}
.health-score::before{content:"";position:absolute;inset:10px;background:var(--surface);border-radius:50%}
.health-score-inner{position:relative;text-align:center}
.health-score-number{font-size:34px;font-weight:900;letter-spacing:-1px}
.health-score-label{font-size:10px;color:var(--muted)}
.empty{text-align:center;padding:32px 15px;color:var(--muted);font-size:12px}
.empty-icon{font-size:29px;margin-bottom:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:100;background:var(--navy);color:white;border:1px solid #ffffff20;padding:12px 18px;border-radius:13px;box-shadow:0 10px 30px #0002;font-size:12px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:#0007;z-index:25;display:none}
.sponsor-card{background:linear-gradient(135deg,#f0ecff,#fff);color:#28204e;border-radius:19px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
[data-theme="dark"] .sponsor-card{background:linear-gradient(135deg,#26213f,#30294e);color:#f2eeff}
.sponsor-logo{font-size:17px;font-weight:950;letter-spacing:1px}
.sponsor-card a{font-weight:800;color:#7460e8;font-size:12px;text-decoration:none}
.onboarding{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 15% 10%,#a59aff35,transparent 40%),radial-gradient(ellipse at 90% 85%,#7061e72b,transparent 38%),var(--bg)}
.onboard-wrap{width:min(100%,520px)}
.onboard-brand{display:flex;justify-content:center;margin-bottom:25px}
.onboard-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,40px);box-shadow:0 25px 80px #20184d15;animation:enter .5s ease}
.onboard-card h1{font-size:29px;line-height:1.2;margin:20px 0 10px}
.onboard-progress{display:flex;gap:6px;margin:0 0 22px}
.onboard-progress span{height:4px;flex:1;border-radius:5px;background:var(--surface2)}
.onboard-progress span.done{background:var(--primary)}
.onboard-mark{width:57px;height:57px;border-radius:18px;background:linear-gradient(145deg,#a69aff,#6553e9);color:white;display:grid;place-items:center;font-size:27px;font-weight:900}
.onboard-footer{text-align:center;color:var(--muted);font-size:10px;margin-top:19px}
.check-row{display:flex;align-items:flex-start;gap:9px;font-size:11px;color:var(--muted);line-height:1.5;margin:15px 0}
.check-row input{margin-top:3px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.switch{width:44px;height:25px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);position:relative;display:inline-block;flex-shrink:0}
.switch::after{content:"";position:absolute;width:19px;height:19px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--primary)}
.switch.on::after{left:21px;background:#fff}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.plan-grid{grid-template-columns:1fr}.plan-card{padding:20px}.plan-card.selected{padding:19px}}
@media(max-width:850px){.sidebar{transform:translateX(-105%);box-shadow:10px 0 40px #0001}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}.main{margin-left:0}.topbar{padding:0 18px}.content{padding:23px 18px 40px}.split{grid-template-columns:1fr}.page-heading{font-size:15px}}
@media(max-width:500px){.stats-grid{gap:10px}.card{padding:16px;border-radius:18px}.stat-value{font-size:22px}.welcome-row{flex-direction:column}.welcome-row>.btn{align-self:flex-start}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{height:68px}.premium-banner{align-items:flex-start;flex-direction:column}.sponsor-card{align-items:flex-start;flex-direction:column}.card-number{font-size:14px}.table-wrap{margin-right:-4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<div id="onboarding" class="onboarding hidden">
  <div class="onboard-wrap">
    <div class="onboard-brand">
      <div class="brand">
        <div class="brand-logo">F</div>
        <div><div class="brand-name">FINOVA</div><div class="brand-tag">YOUR MONEY. MADE CLEARER.</div></div>
      </div>
    </div>
    <div class="onboard-card" id="onboardContent"></div>
    <div class="onboard-footer">Your financial data stays in this browser unless you export it.</div>

</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-logo">F</div>
      <div><div class="brand-name">FINOVA</div><div class="brand-tag">YOUR MONEY. MADE CLEARER.</div></div>

    <div class="nav-label">WORKSPACE</div>

  <div id="overlay" class="overlay"></div>
  <main class="main">

</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

const KEY="finova_royal_indigo_v2";
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const money=v=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(num(v));
const dateLabel=d=>{if(!d)return "—";const x=new Date(d+"T00:00:00");return Number.isNaN(x.getTime())?d:x.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});};
const monthKey=d=>(d||today()).slice(0,7);
const currentMonth=()=>today().slice(0,7);
const sum=a=>a.reduce((t,x)=>t+num(x),0);
const pct=(a,b)=>b>0?Math.max(0,Math.min(100,a/b*100)):0;

const defaultState=()=>({
 version:2,onboarded:false,name:"",age:"",theme:"light",plan:"free",planSince:null,
 transactions:[],accounts:[{id:uid(),name:"Main Account",type:"Savings",balance:0}],
 budgets:[],goals:[],investments:[],assets:[],bills:[],loans:[],cards:[],
 assistantMessages:[],currency:"INR"
});
let state=loadState();
let currentPage="dashboard",onboardStep=0,toastTimer;
function loadState(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw)return defaultState();
  const parsed=JSON.parse(raw);
  return normalize(parsed);
 }catch(e){return defaultState();}
}
function normalize(raw){
 const d=defaultState();
 const s={...d,...(raw&&typeof raw==="object"?raw:{})};
 for(const k of ["transactions","accounts","budgets","goals","investments","assets","bills","loans","cards","assistantMessages"])
  s[k]=Array.isArray(s[k])?s[k].filter(x=>x&&typeof x==="object"):[];
 if(!["free","gold","platinum"].includes(s.plan))s.plan="free";
 if(!["light","dark"].includes(s.theme))s.theme="light";
 s.name=String(s.name||"").slice(0,60);
 s.age=String(s.age||"");
 return s;
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state));}
 catch(e){toast("Could not save data. Export a backup and free browser storage.");}
}
function toast(message){
 const el=$("#toast");el.textContent=message;el.classList.add("show");
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}
function applyTheme(){
 document.documentElement.dataset.theme=state.theme;
 $("#themeBtn").textContent=state.theme==="dark"?"☀":"☾";
}
function planName(p=state.plan){return p==="gold"?"Gold":p==="platinum"?"Platinum":"Free";}
function planPrice(p){return p==="gold"?"₹99 / month":p==="platinum"?"₹1,169 / year":"₹0";}
function planClass(){return state.plan==="gold"?"gold":state.plan==="platinum"?"platinum":"";}
function transactionsForMonth(m=currentMonth()){return state.transactions.filter(t=>monthKey(t.date)===m);}
function accountTotal(){return sum(state.accounts.map(a=>num(a.balance)));}
function investmentTotal(){return sum(state.investments.map(x=>num(x.currentValue)));}
function assetTotal(){return sum(state.assets.filter(x=>x.kind==="asset").map(x=>num(x.value)))+investmentTotal();}
function liabilityTotal(){return sum(state.assets.filter(x=>x.kind==="liability").map(x=>num(x.value)))+sum(state.loans.map(x=>num(x.outstanding)));}
function transactionTotal(type,m=currentMonth()){return sum(transactionsForMonth(m).filter(t=>t.type===type).map(t=>num(t.amount)));}
function netWorth(){return accountTotal()+assetTotal()-liabilityTotal();}
function balanceCardAmount(){return money(accountTotal());}
function render(){
 applyTheme();
 if(!state.onboarded){$("#app").classList.add("hidden");$("#onboarding").classList.remove("hidden");renderOnboarding();return;}
 $("#onboarding").classList.add("hidden");$("#app").classList.remove("hidden");
 $("#avatar").textContent=(state.name||"F").trim().charAt(0).toUpperCase();
 const titles={dashboard:"Dashboard",transactions:"Transactions",accounts:"Accounts",cards:"Debit Cards",budgets:"Budgets",goals:"Savings Goals",investments:"Investments",assets:"Assets & Liabilities",bills:"Bills & Subscriptions",loans:"Loans & EMIs",reports:"Reports",health:"Financial Health",assistant:"FINOVA Assistant",subscription:"Subscription",about:"About FINOVA",settings:"Settings"};
 $("#topTitle").textContent=titles[currentPage]||"Dashboard";
 $$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));
 $("#topAddBtn").textContent=currentPage==="transactions"?"＋ Add transaction":"＋ Add transaction";
 $("#topAddBtn").classList.toggle("hidden",!["dashboard","transactions"].includes(currentPage));
 const pages={dashboard:dashboardPage,transactions:transactionsPage,accounts:accountsPage,cards:cardsPage,budgets:budgetsPage,goals:goalsPage,investments:investmentsPage,assets:assetsPage,bills:billsPage,loans:loansPage,reports:reportsPage,health:healthPage,assistant:assistantPage,subscription:subscriptionPage,about:aboutPage,settings:settingsPage};
 $("#content").innerHTML=`<section class="page">${(pages[currentPage]||dashboardPage)()}</section>`;
 bindPage();
}

  el.innerHTML=progress+`<div class="onboard-mark">F</div><h1>Make your money make sense.</h1><p class="muted">A calmer, clearer place to understand your finances. First, let's personalise your FINOVA experience.</p>
  <form id="onboardForm" class="form-grid">
   <div class="field full"><label for="userName">WHAT SHOULD WE CALL YOU?</label><input id="userName" maxlength="60" required placeholder="Enter your name" value="${esc(state.name)}"></div>
   <div class="field full"><label for="userAge">YOUR AGE</label><input id="userAge" type="number" min="13" max="120" required placeholder="Enter your age" value="${esc(state.age)}"></div>
   <div class="field full"><button class="btn btn-primary btn-full" type="submit">Continue →</button></div>
  </form><p class="small muted">Your information is used to personalise this app and is stored locally in this browser.</p>`;
  $("#onboardForm").onsubmit=e=>{e.preventDefault();const name=$("#userName").value.trim(),age=Number($("#userAge").value);if(!name||name.length>60||!Number.isInteger(age)||age<13||age>120){toast("Enter a valid name and age.");return;}state.name=name;state.age=String(age);onboardStep=1;save();renderOnboarding();};
 }else if(onboardStep===1){
  el.innerHTML=progress+`<div class="onboard-mark">✦</div><h1>Meet FINOVA.</h1><p class="muted">Your personal money workspace, designed to make everyday financial decisions clearer.</p>
  <div class="grid" style="margin:22px 0">
   <div class="assistant-box"><strong>◈ See the bigger picture</strong><div class="small muted">Track income, spending, accounts and estimated net worth.</div></div>
   <div class="assistant-box"><strong>◎ Plan with purpose</strong><div class="small muted">Set budgets, save for goals and monitor bills and EMIs.</div></div>
   <div class="assistant-box"><strong>⌁ Your data, your control</strong><div class="small muted">Save locally and export or restore a JSON backup.</div></div>
  </div>
  <p class="small muted">FINOVA does not connect to your bank or provide verified investment advice. Entered financial values are managed by you.</p>
  <button class="btn btn-primary btn-full" id="aboutContinue">Continue →</button><button class="btn btn-soft btn-full" id="onboardBack" style="margin-top:9px">← Back</button>`;
  $("#aboutContinue").onclick=()=>{onboardStep=2;renderOnboarding();};
  $("#onboardBack").onclick=()=>{onboardStep=0;renderOnboarding();};
 }else{
  el.innerHTML=progress+`<div class="onboard-mark">✧</div><h1>Welcome, ${esc(state.name)}.</h1><p class="muted">Your FINOVA workspace is ready. Choose the experience that suits you. You can change this any time in Subscription.</p>
  <div class="assistant-box"><div style="font-weight:800">Free plan · ₹0</div><div class="small muted">Start tracking your money. Upgrade to Gold or Platinum whenever you're ready.</div></div>
  <button class="btn btn-primary btn-full" id="enterApp">Enter FINOVA →</button><button class="btn btn-soft btn-full" id="onboardBack" style="margin-top:9px">← Back</button>`;
  $("#enterApp").onclick=()=>{state.onboarded=true;save();currentPage="dashboard";render();toast("Welcome to FINOVA, "+state.name+"!");};
  $("#onboardBack").onclick=()=>{onboardStep=1;renderOnboarding();};
 }
}
function statCard(label,value,icon,foot="",cls=""){
 return `<div class="card ${cls}"><div class="section-head"><div class="stat-label">${label}</div><div class="stat-icon">${icon}</div></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;
}
function balanceCard(){
 const p=state.plan;
 return `<div class="card balance-card ${planClass()}">
 <div class="section-head"><div class="stat-label">TOTAL ACCOUNT BALANCE</div><div class="stat-icon">₹</div></div>
 <div class="stat-value">${balanceCardAmount()}</div>
 <div class="balance-bottom"><div><div class="stat-foot">Across ${state.accounts.length} account(s)</div><div style="margin-top:10px"><span class="plan-chip">${p==="gold"?"✦":p==="platinum"?"◆":"●"} ${planName(p)} · ${planPrice(p)}</span></div></div>
 <a class="card-link" href="#" data-goto="subscription">${p==="free"?"Explore Gold ↗":p==="gold"?"View Platinum ↗":"Manage plan ↗"}</a></div></div>`;
}
function chartSvg(){
 const months=[];const d=new Date();d.setDate(1);
 for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({key:x.toISOString().slice(0,7),label:x.toLocaleDateString("en-IN",{month:"short"})});}
 const vals=months.map(m=>({label:m.label,income:transactionTotal("income",m.key),expense:transactionTotal("expense",m.key)}));
 const max=Math.max(1,...vals.flatMap(v=>[v.income,v.expense]))*1.18;
 const h=180,top=12,bottom=25,usable=h-top-bottom;
 let s=`<svg class="chart" viewBox="0 0 600 ${h}" role="img" aria-label="Income and expense chart for six months">`;
 for(let i=0;i<4;i++){const y=top+i*usable/3;s+=`<line x1="28" y1="${y}" x2="590" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/>`;}
 vals.forEach((v,i)=>{const x=48+i*91;const bh=v.income/max*usable,eh=v.expense/max*usable;s+=`<rect x="${x}" y="${top+usable-bh}" width="21" height="${bh}" rx="5" fill="#8170ff"/><rect x="${x+25}" y="${top+usable-eh}" width="21" height="${eh}" rx="5" fill="#ed83ae"/><text x="${x+23}" y="${h-5}" text-anchor="middle" font-size="11" fill="var(--muted)">${v.label}</text>`;});
 return s+"</svg>";
}
function txRows(list,limit=6){
 if(!list.length)return `<div class="empty"><div class="empty-icon">⇄</div>No transactions yet.<br>Start by adding income or an expense.</div>`;
 return `<div class="tx-list">${list.slice(0,limit).map(t=>`<div class="tx-row"><div class="tx-icon">${t.type==="income"?"↙":t.type==="transfer"?"⇄":"↗"}</div><div class="tx-main"><div class="tx-name">${esc(t.description||t.category||"Transaction")}</div><div class="tx-meta">${esc(t.category||"General")} · ${dateLabel(t.date)}</div></div><div class="tx-amount ${t.type==="income"?"positive":t.type==="expense"?"negative":""}">${t.type==="income"?"+":t.type==="expense"?"−":""}${money(t.amount)}</div></div>`).join("")}</div>`;
}
function budgetWidget(){
 if(!state.budgets.length)return `<div class="empty"><div class="empty-icon">◉</div>No budgets set up yet.</div>`;
 return state.budgets.slice(0,4).map(b=>{const spent=sum(state.transactions.filter(t=>t.type==="expense"&&t.category===b.category&&monthKey(t.date)===currentMonth()).map(t=>t.amount));return `<div class="progress-row"><span>${esc(b.category)}</span><strong>${money(spent)} / ${money(b.limit)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${pct(spent,b.limit)}%;${spent>num(b.limit)?"background:var(--red)":""}"></div></div>`;}).join("");
}

  <div class="card"><div class="section-head"><div><h2>Budget tracker</h2><div class="small muted">Spending against your limits</div></div><button class="link-btn" data-goto="budgets">View all →</button></div>${budgetWidget()}</div>

   </div>
  </div>
 </div>
 <div class="sponsor-card"><div><div class="sponsor-logo">DANQVORA</div><div class="small" style="margin-top:6px">Sponsored by DANQVORA · Finance education and financial teachings.</div></div><a href="https://danqvora.com/" target="_blank" rel="noopener noreferrer">Explore DANQVORA ↗</a></div>`;

}

function assetsPage(){

function categoryBreakdown(){
 const expenses=state.transactions.filter(t=>t.type==="expense"),totals={};
 expenses.forEach(t=>totals[t.category||"Other"]=(totals[t.category||"Other"]||0)+num(t.amount));
 const entries=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
 if(!entries.length)return `<div class="empty">Add expenses to see category breakdown.</div>`;
 const total=sum(entries.map(e=>e[1]));
 return entries.slice(0,8).map(([k,v])=>`<div class="progress-row"><span>${esc(k)}</span><strong>${money(v)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${pct(v,total)}%"></div></div>`).join("");
}
function healthPage(){
 const inc=transactionTotal("income"),out=transactionTotal("expense");
 let score=50;
 if(inc>0)score+=Math.round(Math.max(-20,Math.min(20,(inc-out)/inc*20)));
 if(state.budgets.length)score+=8;
 if(state.goals.length)score+=8;
 if(state.accounts.length)score+=5;
 if(state.loans.length&&sum(state.loans.map(l=>l.outstanding))>0)score-=5;
 score=Math.max(0,Math.min(100,score));
 const tips=[];
 if(inc===0)tips.push("Record your income to make cash-flow comparisons meaningful.");
 else if(out>inc)tips.push("Your recorded spending exceeds income this month. Review categories and essential costs.");
 else tips.push("Your recorded income is at least as high as your expenses this month.");
 if(!state.budgets.length)tips.push("Set a monthly budget for your largest spending categories.");
 if(!state.goals.length)tips.push("Create a savings goal and track progress towards it.");
 if(!state.bills.length)tips.push("Record upcoming bills so you can plan for due dates.");
 if(!state.transactions.length)tips.push("Start entering transactions. Your health score is only an illustrative estimate until you have data.");
 return `<div class="welcome-row"><div><h1>Financial health</h1><div class="muted small">A simple educational snapshot based on your manually entered data.</div></div></div>
 <div class="grid split"><div class="card" style="text-align:center"><h2>Your snapshot</h2><div class="health-score" style="--score:${score}%"><div class="health-score-inner"><div class="health-score-number">${score}</div><div class="health-score-label">of 100 · illustrative</div></div></div><div style="font-weight:800">${score>=75?"Good habits taking shape":score>=50?"Room to improve":"Start with the basics"}</div><p class="small muted">This is not a credit score, a bank assessment or professional financial advice.</p></div>
 <div class="card"><h2>Personalised checklist</h2><div class="small muted">Suggestions based on what you have entered</div>${tips.map(t=>`<div class="tx-row"><div class="tx-icon">✦</div><div class="tx-main small">${esc(t)}</div></div>`).join("")}<div class="form-actions"><button class="btn btn-primary" data-goto="budgets">Review budgets</button><button class="btn btn-soft" data-goto="goals">Set a goal</button></div></div></div>
 <div class="grid stats-grid">${statCard("ESTIMATED NET WORTH",money(netWorth()),"◇","Accounts and assets less liabilities")}${statCard("MONTHLY SAVINGS RATE",inc>0?(100*(inc-out)/inc).toFixed(1)+"%":"—","◎","Based on recorded monthly cash flow")}${statCard("ACTIVE BUDGETS",state.budgets.length,"◉","Budget categories")}${statCard("SAVINGS GOALS",state.goals.length,"✧","Goals being tracked")}</div>`;
}

function bindPage(){
 $$("#content [data-goto]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();go(b.dataset.goto);}));
 $$("#content [data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action,b.dataset.id,b)));
 $$("#content [data-delete]").forEach(b=>b.addEventListener("click",()=>deleteItem(b.dataset.delete,b.dataset.id)));
 const txSearch=$("#txSearch");if(txSearch)txSearch.addEventListener("input",()=>{const q=txSearch.value.toLowerCase();$("#txTable").innerHTML=txTable(state.transactions.filter(t=>[t.description,t.category,t.type].join(" ").toLowerCase().includes(q)));bindDeleteOnly();});
 const cf=$("#chatForm");if(cf)cf.onsubmit=e=>{e.preventDefault();sendChat($("#chatInput").value);};
 $$("#content [data-prompt]").forEach(b=>b.addEventListener("click",()=>sendChat(b.dataset.prompt)));

function deleteItem(collection,id){

 state[collection]=state[collection].filter(x=>x.id!==id);save();render();toast("Item deleted.");
}
function selectPlan(id){

function modal(title,body,submitText,callback){

 const div=document.createElement("div");div.id="finovaModal";div.className="onboarding";div.style.cssText="position:fixed;inset:0;z-index:80;background:#0008;overflow:auto;place-items:center";
 div.innerHTML=`<div class="onboard-wrap" style="max-width:620px"><div class="onboard-card"><div class="section-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" id="modalClose" aria-label="Close">×</button></div><form id="modalForm">${body}<div class="form-actions"><button type="submit" class="btn btn-primary">${esc(submitText||"Save")}</button><button type="button" class="btn btn-soft" id="modalCancel">Cancel</button></div></form></div></div>`;
 document.body.appendChild(div);
 const close=()=>div.remove();$("#modalClose").onclick=close;$("#modalCancel").onclick=close;
 $("#modalForm").onsubmit=e=>{e.preventDefault();const form=$("#modalForm");if(!form.reportValidity())return;try{const result=callback(new FormData(form));if(result!==false)close();}catch(err){console.error(err);toast("Could not save this entry.");}};
 const first=div.querySelector("input,select");if(first)first.focus();
}

function assistantReply(raw){
 const q=raw.toLowerCase(),inc=transactionTotal("income"),out=transactionTotal("expense"),cash=inc-out;
 if(/spend|expense|spent|expenditure/.test(q))return `Your recorded expenses for ${new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"})} total ${money(out)}.\n\nThis includes only transactions you entered and dated in the current month.`;
 if(/income|earn|salary/.test(q))return `Your recorded income for this month is ${money(inc)}. Your recorded expenses are ${money(out)}.\n\nMonthly cash flow = income minus expenses = ${money(cash)}.`;
 if(/net worth|wealth|assets/.test(q))return `Your estimated net worth is ${money(netWorth())} based on recorded account balances, assets, investments and liabilities.\n\nThis is an estimate from your entries, not a bank-verified valuation.`;
 if(/budget|overspend|limit/.test(q)){
  if(!state.budgets.length)return "You have not created a budget yet. Open Budgets, add a category and enter a monthly limit. Review your recorded expenses against that limit regularly.";
  return "Your current monthly budgets:\n"+state.budgets.map(b=>{const s=sum(transactionsForMonth().filter(t=>t.type==="expense"&&t.category===b.category).map(t=>t.amount));return `${b.category}: ${money(s)} spent of ${money(b.limit)} (${pct(s,b.limit).toFixed(0)}% used).`;}).join("\n")+"\n\nA budget is a planning guide. Adjust it to match your actual needs and income.";
 }
 if(/save|saving|goal/.test(q))return state.goals.length?"Your savings goals:\n"+state.goals.map(g=>`${g.name}: ${money(g.saved)} of ${money(g.target)} (${pct(g.saved,g.target).toFixed(0)}%).`).join("\n")+"\n\nConsider setting a realistic regular contribution and keeping essential expenses in mind.":"You have no savings goals yet. Open Savings Goals, choose a target amount and date, then update your savings as you contribute.";
 if(/loan|emi|debt/.test(q))return `You have recorded ${money(sum(state.loans.map(l=>l.outstanding)))} in outstanding loans and ${money(sum(state.loans.map(l=>l.emi)))} in monthly EMIs.\n\nReview interest rates, due dates and affordability. This summary is not a recommendation to refinance or repay a particular loan.`;
 if(/invest|stock|mutual fund|return/.test(q))return `Your entered investment value is ${money(investmentTotal())}. Your entered cost basis is ${money(sum(state.investments.map(i=>i.cost)))}.\n\nThe difference is ${money(investmentTotal()-sum(state.investments.map(i=>i.cost)))}. These are manually entered values, not live market data. Past returns do not guarantee future performance.`;
 if(/bill|subscription|due/.test(q))return `You have ${state.bills.filter(b=>!b.paid).length} unpaid bills recorded, totalling ${money(sum(state.bills.filter(b=>!b.paid).map(b=>b.amount)))}. Check the Bills & Subscriptions screen for due dates.`;
 if(/plan|gold|platinum|₹99|1169|subscription/.test(q))return `Your locally selected FINOVA plan is ${planName()} (${planPrice(state.plan)}).\n\nGold is listed at ₹99/month and Platinum at ₹1,169/year. This demo does not process or verify payments. Open Subscription to change your local plan selection.`;
 if(/help|what can you|hello|hi\b/.test(q))return "I can summarise your entered income, expenses, net worth, budgets, goals, bills, loans and investments. Ask a specific question, such as “How much did I spend this month?” I can also explain general budgeting concepts.";
 if(/emergency fund/.test(q))return "A common personal-finance guideline is to build an emergency reserve covering several months of essential expenses. The right amount depends on your responsibilities, income stability and access to support. Start by estimating essential monthly costs and setting a manageable target.";
 if(/50.?30.?20|rule/.test(q))return "The 50/30/20 budget is a general starting framework: about 50% of take-home income for needs, 30% for wants and 20% for savings and debt repayment. It may need adjusting for your income, location, family obligations and debt.";
 return "I can help with questions about the figures saved in FINOVA and basic money-management concepts. Try asking about your monthly spending, income, budget limits, savings goals, net worth or recorded EMIs.\n\nI'm a rule-based helper in this standalone app, not a live AI service or a financial adviser.";
}
function exportBackup(){
 const payload={app:"FINOVA",formatVersion:2,exportedAt:new Date().toISOString(),data:state};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`finova-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("Backup exported.");
}
async function restoreFile(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  if(file.size>10*1024*1024)throw new Error("File is larger than 10 MB.");
  const raw=JSON.parse(await file.text()),data=raw?.app==="FINOVA"?raw.data:raw;
  if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Invalid backup format.");
  const candidate=normalize(data);
  const arrayKeys=["transactions","accounts","budgets","goals","investments","assets","bills","loans","cards","assistantMessages"];
  for(const k of arrayKeys){if(data[k]!==undefined&&!Array.isArray(data[k]))throw new Error(`Invalid ${k} data.`);}
  if(!confirm("Restore this FINOVA backup? Current local data will be replaced."))return;
  state=candidate;save();currentPage="dashboard";render();toast("Backup restored.");
 }catch(err){toast("Restore failed: "+(err.message||"invalid file"));}
 finally{e.target.value="";}
}
function resetData(){
 if(!confirm("Reset all FINOVA data in this browser? Export a backup first if you may need it. This cannot be undone."))return;
 if(!confirm("Final confirmation: permanently clear your local FINOVA data?"))return;
 try{localStorage.removeItem(KEY);}catch(e){}
 state=defaultState();onboardStep=0;currentPage="dashboard";render();toast("Local data reset.");
}
