
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RITORA — Build Better Days</title>
<style>
:root {
  --bg:#080a15; --panel:#141831; --text:#f7f5ff;
  --muted:#9da6c8; --accent:#a16cff; --blue:#45d7ff;
  --line:#ffffff18; --good:#51e5a5;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at top left,#302052,transparent 45%),var(--bg);
 color:var(--text);font-family:Inter,system-ui,sans-serif;
 min-height:100vh;transition:.3s;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}
button.primary{
 background:linear-gradient(120deg,var(--accent),#7955ee);
 border:0;padding:12px 17px;border-radius:13px;font-weight:750;
 box-shadow:0 8px 25px #a16cff35;
}
button.secondary,.iconbtn{
 background:#ffffff08;border:1px solid var(--line);
 border-radius:12px;padding:10px 13px;
}
input,select,textarea{
 width:100%;padding:12px;border-radius:12px;
 background:#080d20;color:var(--text);
 border:1px solid var(--line);margin:5px 0 13px;
}
.app{display:none}
.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
.sidebar{
 padding:24px 15px;border-right:1px solid var(--line);
 background:#080a16c9;position:sticky;top:0;height:100vh;
 display:flex;flex-direction:column;gap:7px;
}
.brand{padding:8px 10px 28px;font-size:19px;letter-spacing:5px;font-weight:900}
.brand span{color:var(--accent)}
.navbtn{
 text-align:left;background:transparent;border:1px solid transparent;
 border-radius:13px;padding:12px;color:var(--muted);
}
.navbtn.active,.navbtn:hover{
 color:var(--text);background:#a16cff20;border-color:var(--line)
}
main{padding:27px;max-width:1500px;width:100%;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
h1{font-size:clamp(26px,4vw,39px);letter-spacing:-1.5px;margin:5px 0}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted);font-size:12px}
.eyebrow{color:var(--blue);font-size:10px;letter-spacing:2px;font-weight:800}
.view{display:none;animation:enter .3s ease}
.view.active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
 background:linear-gradient(145deg,#171b39e8,#111529e8);
 border:1px solid var(--line);border-radius:21px;padding:20px;
 box-shadow:0 18px 55px #0002;margin-bottom:16px;
}
.hero{
 padding:28px;min-height:220px;
 background:radial-gradient(ellipse at top right,#a16cff55,transparent 55%),linear-gradient(125deg,#21163b,#101c32);
}
.hero h2{font-size:clamp(26px,4vw,40px);letter-spacing:-1.5px;margin-top:18px}
.hero p{max-width:480px;line-height:1.7;color:#c0c7e1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.stat{font-size:29px;font-weight:850;margin:12px 0 5px}
.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:27px 0 13px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.rico{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#a16cff22;font-size:20px;flex-shrink:0}
.rbody{flex:1;min-width:0}
.rbody b{font-size:13px}
.rbody small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.check{width:28px;height:28px;border:1px solid #66708f;background:transparent;border-radius:9px}
.check.done{background:var(--good);color:#092319;border-color:var(--good)}
.progress{height:7px;background:#ffffff14;border-radius:9px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:9px}
.ring{
 width:145px;height:145px;border-radius:50%;margin:18px auto;
 display:grid;place-items:center;
 background:radial-gradient(circle,#141831 59%,transparent 61%),conic-gradient(var(--accent) var(--p,0%),#ffffff16 0);
 box-shadow:0 0 40px #a16cff25;
}
.ring b{font-size:32px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input{flex:1;min-width:160px;margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.pills button{border:1px solid var(--line);border-radius:30px;background:#ffffff08;padding:8px 12px;font-size:11px}
.pills button.active{background:var(--accent);border-color:var(--accent)}
.chart{height:170px;display:flex;align-items:end;gap:14px;padding-top:15px}
.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}
.bar{width:min(32px,80%);border-radius:7px 7px 2px 2px;background:linear-gradient(var(--blue),var(--accent));min-height:3px}
.barwrap small{color:var(--muted);font-size:10px}
.themegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.theme{padding:0;text-align:left;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#ffffff08}
.theme.selected{outline:2px solid var(--accent)}
.swatch{height:80px}
.theme b{display:block;padding:10px;font-size:12px}
.modalback{display:none;position:fixed;inset:0;z-index:20;background:#000b;backdrop-filter:blur(9px);place-items:center;padding:15px}
.modalback.open{display:grid}
.modal{width:min(500px,100%);max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:24px;background:#131831}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
.formgrid label{font-size:11px;color:var(--muted)}
.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:1px solid var(--line);border-radius:10px;background:#ffffff05;min-height:60px;padding:7px 3px}
.day.today{border-color:var(--accent);background:#a16cff25}
.focusring{width:min(270px,70vw);height:min(270px,70vw);margin:25px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#141831 59%,transparent 61%),conic-gradient(var(--blue) var(--fp,0deg),#ffffff15 0);box-shadow:0 0 50px #45d7ff22}
.focusring strong{font-size:clamp(38px,8vw,55px)}
.bottomnav{display:none}
.onboard{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#392160,transparent 55%),var(--bg)}
.onbox{width:min(480px,100%);padding:clamp(25px,6vw,45px);background:#131831eF;border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 100px #0006}
.orb{width:80px;height:80px;border-radius:50%;margin:0 auto 25px;background:radial-gradient(circle at 30% 25%,white,#d2a8ff 12%,#8454ff 40%,#10172e 72%);box-shadow:0 0 55px #9a65ff70}
.onbox h1{text-align:center}
.onbox p{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:25px}
.onbox label{font-size:12px;color:var(--muted)}
.onbox .primary{width:100%;margin-top:10px}
.onbox .field{margin:6px 0 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:50;background:#242b4b;border:1px solid var(--line);padding:12px 17px;border-radius:12px;transition:.2s;pointer-events:none;font-size:12px}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.light{--bg:#f0f2fc;--text:#1a1b33;--muted:#68718e;--panel:#fff;--line:#7775a426;background:radial-gradient(ellipse at top left,#e2d8ff,transparent 50%),var(--bg)}
body.light .card,body.light .sidebar,body.light .modal,body.light .onbox{background:#ffffffeb}
body.light input,body.light select,body.light textarea{background:#fff;color:var(--text)}
body.light .hero{background:linear-gradient(120deg,#e7dfff,#e6f6ff)}
body.light .hero p{color:#505879}
body.light .ring,body.light .focusring{background:radial-gradient(circle,#fff 59%,transparent 61%),conic-gradient(var(--accent) var(--p,0%),#e3e5f0 0)}
body.light .focusring{background:radial-gradient(circle,#fff 59%,transparent 61%),conic-gradient(var(--blue) var(--fp,0deg),#e3e5f0 0)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.layout{grid-template-columns:190px 1fr}}
@media(max-width:680px){
 .layout{display:block}.sidebar{display:none}main{padding:17px 13px 100px}
 header{align-items:flex-start}.grid{gap:9px}.card{padding:16px;border-radius:18px}
 .hero{padding:22px}.themegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bottomnav{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom));background:#090b17ed;backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .bottomnav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:4px}
 .bottomnav button span{font-size:19px}.bottomnav button.active{color:var(--blue)}
 .formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}
 .stat{font-size:24px}.ring{width:125px;height:125px}
}
</style>
</head>
<body>
<section class="onboard" id="onboard"><div class="onbox" id="onbox"></div></section>
<div class="app" id="app"><div class="layout">
<aside class="sidebar"><div class="brand"><span>◈</span> RITORA</div><div id="sideNav"></div><div style="margin-top:auto" class="muted">Build better days, one ritual at a time.</div></aside>
<main>
<header><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL SPACE</div><h1 id="heading">Welcome back</h1><div class="muted" id="dateText"></div></div><div style="display:flex;gap:7px"><button class="iconbtn" id="lightBtn" title="Toggle appearance">☼</button><button class="primary" id="addTop">＋ Routine</button></div></header>
<section class="view active" id="v-home"></section><section class="view" id="v-routines"></section>
<section class="view" id="v-calendar"></section><section class="view" id="v-focus"></section>
<section class="view" id="v-goals"></section><section class="view" id="v-journal"></section>
<section class="view" id="v-insights"></section><section class="view" id="v-themes"></section>
<section class="view" id="v-profile"></section>
</main></div><nav class="bottomnav" id="bottomNav"></nav></div>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const KEY='ritora.v1';
const nav=[['home','⌂','Today'],['routines','☷','Routines'],['calendar','▦','Calendar'],['focus','◉','Focus'],['goals','◎','Goals'],['journal','✎','Journal'],['insights','▥','Insights'],['themes','✧','Themes'],['profile','⚙','Profile']];
const themes={
 Aurora:['#a16cff','#45d7ff','#080a15','#141831'],
 Obsidian:['#e8b75e','#f5e5b6','#100e0b','#261e16'],
 Zen:['#70b89a','#d4b982','#101713','#1c2c24'],
 Cyber:['#27e1d2','#5a88ff','#071116','#0b232b'],
 Sunrise:['#ff9b66','#ff5e9b','#1b1017','#2f1825'],
 Midnight:['#6598ff','#b2a2ff','#070d1b','#111d34']
};
const cats=['Health','Study','Work','Personal','Wellness','Home'];
const icons=['☀️','💧','🧘','📚','🏋️','🥗','💻','🌙','🚶','📝','🎯','🎨','🧹','🎵'];
const id=()=>Math.random().toString(36).slice(2,10);
const key=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=t=>{let [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
const fresh=()=>({profile:{name:'',age:20,theme:'Aurora',light:false},routines:[
{id:id(),name:'Wake up',time:'06:30',category:'Wellness',icon:'☀️',duration:5,repeat:'Daily',done:[]},
{id:id(),name:'Drink water',time:'06:40',category:'Health',icon:'💧',duration:2,repeat:'Daily',done:[]},
{id:id(),name:'Meditation',time:'06:50',category:'Wellness',icon:'🧘',duration:10,repeat:'Daily',done:[]},
{id:id(),name:'Read',time:'07:10',category:'Study',icon:'📚',duration:20,repeat:'Daily',done:[]},
{id:id(),name:'Movement',time:'07:40',category:'Health',icon:'🏋️',duration:30,repeat:'Daily',done:[]}
],goals:[],journal:[],sessions:[]});
let state,view='home',filter='All',search='',month=new Date().getMonth(),year=new Date().getFullYear(),selected=key(),focusMode='Focus',seconds=1500,total=1500,running=false,timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Storage full. Export your backup.')}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.profile&&Array.isArray(x.routines)){state={...fresh(),...x,profile:{...fresh().profile,...x.profile}};state.routines=state.routines.map(r=>({...r,done:Array.isArray(r.done)?r.done:[]}));return}}catch(e){}state=fresh()}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function applyTheme(){let t=themes[state.profile.theme]||themes.Aurora;document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--blue',t[1]);document.documentElement.style.setProperty('--bg',t[2]);document.documentElement.style.setProperty('--panel',t[3]);document.body.classList.toggle('light',state.profile.light);$('#lightBtn').textContent=state.profile.light?'☾':'☼'}
function done(r,d=key()){return r.done.includes(d)}
function todays(d=new Date()){return state.routines.filter(r=>r.repeat==='Daily'||r.repeat==='Once'||r.repeat==='Weekdays'&&![0,6].includes(d.getDay())||r.repeat==='Weekends'&&[0,6].includes(d.getDay()))}
function doneN(){return todays().filter(r=>done(r)).length}
function percent(){return todays().length?Math.round(doneN()/todays().length*100):0}
function streak(){let d=new Date(),n=0;if(!state.routines.some(r=>done(r,key())))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){if(state.routines.some(r=>done(r,key(d)))){n++;d.setDate(d.getDate()-1)}else break}return n}
function row(r,d=key()){let yes=done(r,d);return `<div class="row"><div class="rico">${esc(r.icon)}</div><div class="rbody"><b style="${yes?'text-decoration:line-through;opacity:.65':''}">${esc(r.name)}</b><small>${time(r.time)} · ${esc(r.category)} · ${r.duration} min</small></div><button class="check ${yes?'done':''}" data-toggle="${r.id}" data-day="${d}">${yes?'✓':''}</button><button class="secondary" data-edit="${r.id}">···</button></div>`}
function navRender(){$('#sideNav').innerHTML=nav.map(([id,ico,label])=>`<button class="navbtn ${view===id?'active':''}" data-view="${id}" style="display:block;width:100%;margin-bottom:5px">${ico} &nbsp; ${label}</button>`).join('');$('#bottomNav').innerHTML=nav.filter(x=>['home','routines','focus','insights','profile'].includes(x[0])).map(([id,ico,label])=>`<button class="${view===id?'active':''}" data-view="${id}"><span>${ico}</span>${label}</button>`).join('')}
function go(v){view=v;all('.view').forEach(e=>e.classList.toggle('active',e.id==='v-'+v));navRender();let n=nav.find(x=>x[0]===v);$('#eyebrow').textContent=v==='home'?'YOUR PERSONAL SPACE':'YOUR SPACE / '+n[2].toUpperCase();$('#heading').textContent=({home:`Welcome back, ${state.profile.name.split(' ')[0]}`,routines:'Your routines',calendar:'Your calendar',focus:'Focus studio',goals:'Goals & milestones',journal:'Notes & journal',insights:'Your progress',themes:'Theme studio',profile:'Your profile'})[v];$('#dateText').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('#addTop').style.display=['home','routines'].includes(v)?'':'none';render(v);window.scrollTo({top:0,behavior:'smooth'})}
function stat(label,val,foot,ico){return `<div class="card"><div class="muted">${ico} ${label}</div><div class="stat">${val}</div><div class="muted">${foot}</div></div>`}
function days(n=7){return Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(n-1-i));return {date:key(d),label:d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)}})}
function chart(){let ds=days(),ns=ds.map(d=>state.routines.filter(r=>done(r,d.date)).length),max=Math.max(1,...ns);return `<div class="chart">${ds.map((d,i)=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,ns[i]/max*100)}%"></div><small>${d.label}</small></div>`).join('')}</div>`}
function home(){let rs=todays().sort((a,b)=>a.time.localeCompare(b.time)),next=rs.find(r=>!done(r));return `<div class="split"><div class="card hero"><div class="eyebrow">✦ ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h2>Small steps.<br>Remarkable days.</h2><p>Your future is built in the little things you repeat. Show up for yourself today, ${esc(state.profile.name.split(' ')[0])}.</p><button class="primary" data-view="routines">View my routines →</button></div><div class="card" style="text-align:center"><div class="eyebrow">TODAY'S MOMENTUM</div><div class="ring" style="--p:${percent()}%"><div><b>${percent()}%</b><div class="muted">DAILY PROGRESS</div></div></div><div class="muted">${doneN()} of ${rs.length} complete · 🔥 ${streak()} day streak</div></div></div><div class="grid" style="margin:15px 0">${stat('Completed today',doneN()+'/'+rs.length,'Small wins add up','✓')}${stat('Current streak',streak()+' days','Keep the rhythm alive','🔥')}${stat('Planned time',rs.reduce((s,r)=>s+(+r.duration||0),0)+' min','Time invested in you','◷')}${stat('Active routines',state.routines.length,'Your personal system','✦')}</div><div class="split"><div><div class="sectionhead"><h2>Today's rituals</h2><button class="secondary" data-action="add">＋ Add</button></div><div class="card">${rs.map(r=>row(r)).join('')||'No routines yet — add your first.'}</div><div class="sectionhead"><h2>Quick launch</h2></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="card" data-view="focus">◉<h3>Focus</h3><span class="muted">Start a session</span></button><button class="card" data-view="journal">✎<h3>Journal</h3><span class="muted">Clear your mind</span></button><button class="card" data-view="goals">◎<h3>Goals</h3><span class="muted">Make progress</span></button></div></div><div><div class="card"><div class="eyebrow">A NOTE TO YOURSELF</div><h2 style="margin-top:15px;line-height:1.5">“You don't have to see the whole staircase. Just take the first step.”</h2><span class="muted">One intentional moment at a time.</span></div><div class="sectionhead"><h2>Coming up next</h2></div><div class="card">${next?row(next):'You are all caught up. Enjoy the space you created.'}</div><div class="sectionhead"><h2>Weekly rhythm</h2></div><div class="card">${chart()}</div></div></div>`}
function routines(){let rs=state.routines.filter(r=>(filter==='All'||r.category===filter)&&(r.name+' '+r.category).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card hero"><div class="eyebrow">YOUR PERSONAL SYSTEM</div><h2>Consistency over intensity.</h2><p>Build a rhythm that supports the person you're becoming.</p><button class="primary" data-action="add">＋ Create routine</button></div><div class="toolbar"><input id="search" placeholder="Search routines…" value="${esc(search)}"><select id="filter" style="width:auto;margin:0">${['All',...cats].map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="card">${rs.map(r=>row(r)).join('')||'<p class="muted">No routines match your search.</p>'}</div>`}
function calendar(){let first=new Date(year,month,1),count=new Date(year,month+1,0).getDate(),html='';for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let d=1;d<=count;d++){let dt=new Date(year,month,d),k=key(dt),n=state.routines.filter(r=>done(r,k)).length;html+=`<button class="day ${k===key()?'today':''}" data-date="${k}">${d}${n?`<div style="color:var(--blue);font-size:10px;margin-top:7px">● ${n}</div>`:''}</button>`}let dt=new Date(selected+'T12:00:00'),rs=state.routines.filter(r=>r.repeat==='Daily'||r.repeat==='Once'||r.repeat==='Weekdays'&&![0,6].includes(dt.getDay())||r.repeat==='Weekends'&&[0,6].includes(dt.getDay())).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card"><div class="sectionhead" style="margin-top:0"><button class="secondary" data-month="-1">‹</button><h2>${new Date(year,month,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="secondary" data-month="1">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${html}</div></div><div class="sectionhead"><h2>${dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div><div class="card">${rs.map(r=>row(r,selected)).join('')||'No routines scheduled.'}</div>`}
function focus(){return `<div class="split"><div class="card" style="text-align:center;padding:28px 16px"><div class="eyebrow">✦ YOUR FOCUS STUDIO</div><h2 style="margin-top:10px">Be here, now.</h2><p class="muted">One thing at a time. Give it your attention.</p><div class="pills" style="justify-content:center">${[['Focus',25],['Short break',5],['Long break',15]].map(([n,m])=>`<button class="${focusMode===n?'active':''}" data-fmode="${n}">${n}</button>`).join('')}</div><div class="focusring" id="focusring"><div><strong id="focusTime">25:00</strong><div class="muted">${focusMode.toUpperCase()}</div></div></div><button class="primary" id="focusStart">${running?'Ⅱ Pause':'▶ Start session'}</button> <button class="secondary" id="focusReset">↺ Reset</button></div><div class="card"><div class="eyebrow">SESSION INTENTION</div><h2 style="margin-top:12px">What are you focusing on?</h2><input id="focusTask" placeholder="e.g. Read 10 pages"><div class="sectionhead"><h2>Today's sessions</h2></div><div class="stat">${state.sessions.filter(s=>s.date===key()).length}</div><div class="muted">Completed sessions saved on this device</div>${state.sessions.slice(-5).reverse().map(s=>`<div class="row"><div class="rbody"><b>${esc(s.task||s.mode)}</b><small>${s.date} · ${s.minutes} minutes</small></div>✓</div>`).join('')}</div></div>`}
function goals(){return `<div class="card hero"><div class="eyebrow">LONG-TERM THINKING</div><h2>Give your effort a direction.</h2><p>Choose meaningful goals and make progress visible.</p><button class="primary" data-action="goal">＋ Create a goal</button></div><div class="card">${state.goals.map(g=>`<div class="row"><div class="rbody"><b>${esc(g.name)}</b><small>${g.current} of ${g.target} · ${esc(g.category)}</small><div class="progress"><span style="width:${Math.min(100,g.current/g.target*100)}%"></span></div></div><button class="secondary" data-goalplus="${g.id}">＋</button><button class="secondary" data-goaledit="${g.id}">Edit</button><button class="secondary" data-goaldel="${g.id}">×</button></div>`).join('')||'<p class="muted">Create your first goal and start making progress.</p>'}</div>`}
function journal(){return `<div class="card hero"><div class="eyebrow">A MOMENT FOR YOURSELF</div><h2>Clear your mind. Keep the lesson.</h2><p>Capture reflections, ideas, and the little things you don't want to forget.</p><button class="primary" data-action="journal">＋ Write an entry</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${state.journal.slice().reverse().map(j=>`<div class="card"><div class="eyebrow">${esc(j.category)} · ${j.date}</div><h3 style="margin-top:12px">${esc(j.title)}</h3><p style="white-space:pre-wrap;line-height:1.6;font-size:13px">${esc(j.body)}</p><button class="secondary" data-jdel="${j.id}">Delete</button></div>`).join('')||'<div class="card muted">Your journal starts here.</div>'}</div>`}
function insights(){let ds=days(),nums=ds.map(d=>state.routines.filter(r=>done(r,d.date)).length),max=Math.max(1,...nums);return `<div class="grid">${stat('7-day completions',nums.reduce((a,b)=>a+b,0),'Recorded completions','◈')}${stat('Current streak',streak()+' days','Consecutive active days','🔥')}${stat('Focus sessions',state.sessions.length,'Saved sessions','◉')}${stat('Goals',state.goals.length,'Personal milestones','◎')}</div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Weekly consistency</h2><span class="muted">Last 7 days</span></div><div class="chart">${ds.map((d,i)=>`<div class="barwrap"><b style="font-size:10px">${nums[i]}</b><div class="bar" style="height:${Math.max(3,nums[i]/max*100)}%"></div><small>${d.label}</small></div>`).join('')}</div><p class="muted">Charts reflect the completion dates stored on this device. Historical planned tasks are not reconstructed.</p></div><div class="card"><h2>Routine mix</h2>${cats.map(c=>{let n=state.routines.filter(r=>r.category===c).length;return n?`<p>${c} <span class="muted">· ${n}</span></p><div class="progress"><span style="width:${n/state.routines.length*100}%"></span></div>`:''}).join('')}</div>`}
function themesView(){return `<div class="card hero"><div class="eyebrow">YOUR SPACE, YOUR ENERGY</div><h2>Set the atmosphere.</h2><p>Choose a visual world that makes your space feel like yours.</p></div><div class="card"><div class="themegrid">${Object.entries(themes).map(([n,t])=>`<button class="theme ${state.profile.theme===n?'selected':''}" data-theme="${n}"><div class="swatch" style="background:radial-gradient(ellipse at 80% 0%,${t[1]}99,transparent 55%),linear-gradient(140deg,${t[2]},${t[3]})"></div><b>${n}</b></button>`).join('')}</div><div class="sectionhead"><h2>Display preferences</h2></div><div class="row"><div class="rbody"><b>Light appearance</b><small>Use a bright interface</small></div><button class="secondary" data-light>${state.profile.light?'On':'Off'}</button></div></div>`}
function profile(){return `<div class="split"><div class="card"><div class="eyebrow">YOUR PERSONAL SPACE</div><h2 style="margin-top:15px">${esc(state.profile.name)}</h2><p class="muted">${state.profile.age} years old</p><div class="sectionhead"><h2>Your journey</h2></div><p class="muted">Routines completed: ${state.routines.reduce((n,r)=>n+r.done.length,0)}</p><p class="muted">Journal entries: ${state.journal.length}</p><p class="muted">Goals: ${state.goals.length}</p></div><div class="card"><h2>Personal details</h2><form id="profileForm"><label class="muted">Name</label><input id="pname" required maxlength="60" value="${esc(state.profile.name)}"><label class="muted">Age</label><input id="page" type="number" min="1" max="120" required value="${state.profile.age}"><label class="muted">Theme</label><select id="ptheme">${Object.keys(themes).map(t=>`<option ${t===state.profile.theme?'selected':''}>${t}</option>`).join('')}</select><button class="primary">Save profile</button></form><div class="sectionhead"><h2>Data & privacy</h2></div><div class="row"><div class="rbody"><b>Export backup</b><small>Download your data as JSON</small></div><button class="secondary" data-action="export">Export</button></div><div class="row"><div class="rbody"><b>Restore backup</b><small>Import a previous backup</small></div><button class="secondary" data-action="import">Import</button></div><div class="row"><div class="rbody"><b>About Ritora</b><small>App details and storage information</small></div><button class="secondary" data-action="about">About</button></div><div class="row"><div class="rbody"><b style="color:#ff779b">Reset all data</b><small>Permanently clear this browser's saved data</small></div><button class="secondary" data-action="reset">Reset</button></div><p class="muted">Data stays in this browser. There is no cloud sync. Export a backup periodically.</p></div></div>`}
function render(v){let f={home,routines,calendar,focus,goals,journal,insights,themes:themesView,profile}[v];if(f)$('#v-'+v).innerHTML=f();if(v==='focus')updateFocus()}
function refresh(){applyTheme();navRender();['home','routines','calendar','focus','goals','journal','insights','themes','profile'].forEach(render)}
function onboard(step){let p=state.profile,el=$('#onbox');el.innerHTML=`<div class="orb"></div><div class="eyebrow" style="text-align:center">A NEW KIND OF DAILY ROUTINE</div>`+(step===1?`<h1>Build better days.</h1><p>A personal space for your routines, focus, goals, and small habits that make life meaningful.</p><label>Your name</label><input class="field" id="onname" maxlength="60" placeholder="What should we call you?" value="${esc(p.name)}"><label>Your age</label><input class="field" id="onage" type="number" min="1" max="120" value="${p.age||20}"><button class="primary" id="onnext">Create my space →</button><p>Private by design · Saved on this device</p>`:step===2?`<h1>Meet Ritora.</h1><p>Your personal routine companion. Plan with intention, protect your focus, track progress, and make small wins count.</p><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card">☷<h3>Daily rituals</h3><span class="muted">Build a rhythm</span></div><div class="card">◉<h3>Deep focus</h3><span class="muted">Make time count</span></div><div class="card">◎<h3>Meaningful goals</h3><span class="muted">Track progress</span></div><div class="card">✧<h3>Your atmosphere</h3><span class="muted">Choose a theme</span></div></div><button class="primary" id="onnext">Continue →</button><p>No account required · No cloud sync</p>`:`<h1>Welcome, ${esc(p.name.split(' ')[0])}.</h1><p>Your personal space is ready. Start with a routine, choose your theme, and let small wins add up.</p><div class="card">✓ Profile created<br><br>✦ Starter routines added<br><br>✧ ${esc(p.theme)} theme selected</div><button class="primary" id="onnext">Enter Ritora ✦</button>`);$('#onnext').onclick=()=>{if(step===1){let n=$('#onname').value.trim(),a=Number($('#onage').value);if(!n||!Number.isInteger(a)||a<1||a>120){toast('Enter a valid name and age');return}p.name=n;p.age=a;save();onboard(2)}else if(step===2)onboard(3);else{$('#onboard').style.display='none';$('#app').style.display='block';refresh();go('home')}}}
function modal(title,body){$('#modal').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="iconbtn" data-close>×</button></div>${body}`;$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open')}
function routineForm(rid0){let r=rid0?state.routines.find(x=>x.id===rid0):null;modal(r?'Edit routine':'Create a routine',`<form id="routineForm"><div class="formgrid"><div class="full"><label>Routine name *</label><input id="rn" required maxlength="90" value="${esc(r?.name||'')}" placeholder="e.g. Morning walk"></div><div><label>Icon</label><select id="ri">${icons.map(i=>`<option ${i===(r?.icon||'☀️')?'selected':''}>${i}</option>`).join('')}</select></div><div><label>Category</label><select id="rc">${cats.map(c=>`<option ${c===(r?.category||'Personal')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Time</label><input id="rt" type="time" required value="${r?.time||'08:00'}"></div><div><label>Duration (minutes)</label><input id="rd" type="number" min="1" max="1440" required value="${r?.duration||10}"></div><div class="full"><label>Repeat</label><select id="rr">${['Daily','Weekdays','Weekends','Once'].map(c=>`<option ${c===(r?.repeat||'Daily')?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="formactions">${r?'<button type="button" class="secondary" id="rdelete">Delete</button>':''}<button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save</button></div></form>`);$('#routineForm').onsubmit=e=>{e.preventDefault();let d={name:$('#rn').value.trim(),icon:$('#ri').value,category:$('#rc').value,time:$('#rt').value,duration:Number($('#rd').value),repeat:$('#rr').value};if(!d.name||!Number.isInteger(d.duration)||d.duration<1||d.duration>1440){toast('Check routine details');return}if(r)Object.assign(r,d);else state.routines.push({id:id(),...d,done:[]});save();closeModal();refresh();go('routines');toast('Routine saved ✦')};if(r)$('#rdelete').onclick=()=>{if(confirm(`Delete "${r.name}"?`)){state.routines=state.routines.filter(x=>x.id!==r.id);save();closeModal();refresh()}}}
function goalForm(gid){let g=gid?state.goals.find(x=>x.id===gid):null;modal(g?'Edit goal':'Create a goal',`<form id="goalForm"><label>Goal name</label><input id="gn" required maxlength="90" value="${esc(g?.name||'')}" placeholder="e.g. Read 12 books"><div class="formgrid"><div><label>Target</label><input id="gt" type="number" min="1" required value="${g?.target||12}"></div><div><label>Current progress</label><input id="gc" type="number" min="0" required value="${g?.current||0}"></div></div><label>Category</label><select id="gcat">${cats.map(c=>`<option ${c===(g?.category||'Personal')?'selected':''}>${c}</option>`).join('')}</select><div class="formactions"><button class="secondary" type="button" data-close>Cancel</button><button class="primary">Save goal</button></div></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();let d={name:$('#gn').value.trim(),target:Number($('#gt').value),current:Number($('#gc').value),category:$('#gcat').value};if(!d.name||!Number.isInteger(d.target)||d.target<1||!Number.isInteger(d.current)||d.current<0){toast('Check goal details');return}if(g)Object.assign(g,d);else state.goals.push({id:id(),...d});save();closeModal();refresh();go('goals')}}
function journalForm(){modal('New journal entry',`<form id="jform"><label>Title</label><input id="jt" required maxlength="100" placeholder="What is on your mind?"><label>Category</label><select id="jc">${['Reflection','Ideas','Study','Health','Personal','Gratitude'].map(x=>`<option>${x}</option>`).join('')}</select><label>Your entry</label><textarea id="jb" rows="6" required maxlength="10000" placeholder="Write freely…"></textarea><div class="formactions"><button class="secondary" type="button" data-close>Cancel</button><button class="primary">Save entry</button></div></form>`);$('#jform').onsubmit=e=>{e.preventDefault();state.journal.push({id:id(),title:$('#jt').value.trim(),category:$('#jc').value,body:$('#jb').value.trim(),date:key()});save();closeModal();refresh();go('journal');toast('Entry saved on this device')}}
function backup(){let b=new Blob([JSON.stringify({app:'Ritora',version:1,data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`ritora-backup-${key()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result),d=x.data||x;if(!d.profile||!Array.isArray(d.routines)||!Array.isArray(d.goals)||!Array.isArray(d.journal))throw 0;if(!confirm('Replace current data with this backup?'))return;state={...fresh(),...d,profile:{...fresh().profile,...d.profile}};save();refresh();go('home');toast('Backup restored')}catch(e){toast('Invalid Ritora backup file')}};rd.readAsText(f)};i.click()}
function about(){modal('About Ritora',`<div class="orb"></div><p class="muted" style="line-height:1.8">Ritora is a personal routine companion for building consistency without clutter. Manage routines, focus sessions, goals, and journal entries in one place.</p><p class="muted">Version 1.0. Data is stored in this browser. No cloud sync or guaranteed notifications.</p>`)}
function action(a){if(a==='add')routineForm();if(a==='goal')goalForm();if(a==='journal')journalForm();if(a==='export')backup();if(a==='import')restore();if(a==='about')about();if(a==='reset'&&confirm('Permanently clear all Ritora data from this browser?')){localStorage.removeItem(KEY);clearInterval(timer);state=fresh();$('#app').style.display='none';$('#onboard').style.display='grid';onboard(1)}}
function updateFocus(){let el=$('#focusTime');if(el)el.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;let ring=$('#focusring');if(ring)ring.style.setProperty('--fp',`${(1-seconds/total)*360}deg`);let b=$('#focusStart');if(b)b.textContent=running?'Ⅱ Pause':'▶ Start session'}
function setMode(m){if(running){toast('Pause the timer first');return}focusMode=m;total=({Focus:25,'Short break':5,'Long break':15})[m]*60;seconds=total;render('focus')}
function finish(){running=false;clearInterval(timer);timer=null;if(focusMode==='Focus'){state.sessions.push({id:id(),date:key(),minutes:Math.round(total/60),task:$('#focusTask')?.value.trim()||'',mode:focusMode});save();toast('Focus session complete!')}else toast('Break complete!');seconds=total;refresh();go('focus')}
function start(){if(running){running=false;clearInterval(timer);timer=null;updateFocus();return}running=true;updateFocus();timer=setInterval(()=>{seconds--;updateFocus();if(seconds<=0)finish()},1000)}
document.addEventListener('click',e=>{
 let b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){go(b.dataset.view);return}
 if(b.dataset.toggle){let r=state.routines.find(x=>x.id===b.dataset.toggle),d=b.dataset.day||key();if(r){r.done=done(r,d)?r.done.filter(x=>x!==d):[...r.done,d];save();refresh();}return}
 if(b.dataset.edit){routineForm(b.dataset.edit);return}
 if(b.dataset.action){action(b.dataset.action);return}
 if(b.dataset.theme){state.profile.theme=b.dataset.theme;save();refresh();toast(`${b.dataset.theme} theme applied`);return}
 if(b.hasAttribute('data-light')){state.profile.light=!state.profile.light;save();refresh();return}
 if(b.dataset.month){month+=Number(b.dataset.month);if(month<0){month=11;year--}if(month>11){month=0;year++}render('calendar');return}
 if(b.dataset.date){selected=b.dataset.date;render('calendar');return}
 if(b.dataset.fmode){setMode(b.dataset.fmode);return}
 if(b.id==='focusStart'){start();return}if(b.id==='focusReset'){running=false;clearInterval(timer);timer=null;seconds=total;updateFocus();return}
 if(b.dataset.goalplus){let g=state.goals.find(x=>x.id===b.dataset.goalplus);g.current=Math.min(g.target,g.current+1);save();render('goals');return}
 if(b.dataset.goaledit){goalForm(b.dataset.goaledit);return}
 if(b.dataset.goaldel&&confirm('Delete this goal?')){state.goals=state.goals.filter(x=>x.id!==b.dataset.goaldel);save();render('goals');return}
 if(b.dataset.jdel&&confirm('Delete this journal entry?')){state.journal=state.journal.filter(x=>x.id!==b.dataset.jdel);save();render('journal');return}
 if(b.hasAttribute('data-close')||b.id==='modalBack'&&e.target===b)closeModal();
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;render('routines');let x=$('#search');x.focus();x.setSelectionRange(search.length,search.length)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render('routines')}});
document.addEventListener('submit',e=>{
 if(e.target.id==='profileForm'){e.preventDefault();let n=$('#pname').value.trim(),a=Number($('#page').value);if(!n||!Number.isInteger(a)||a<1||a>120){toast('Check name and age');return}state.profile.name=n;state.profile.age=a;state.profile.theme=$('#ptheme').value;save();refresh();go('profile');toast('Profile saved')}
 if(e.target.id==='jform'){e.preventDefault()}
});
$('#addTop').onclick=()=>routineForm();$('#lightBtn').onclick=()=>{state.profile.light=!state.profile.light;save();refresh()};
$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();applyTheme();if(state.profile.name){$('#onboard').style.display='none';$('#app').style.display='block';refresh();go('home')}else onboard(1);
})();
</script>
</body>
</html>
